<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>王镱潼 | 个人主页</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23d89058'/><text x='50' y='65' font-size='44' text-anchor='middle' fill='%232e1e10' font-family='sans-serif' font-weight='bold'>潼</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;background:#1e1610;color:#f0e4d4;overflow-x:hidden;min-height:100vh}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;outline:none;font-family:inherit}

#petalCanvas,#particleCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
#particleCanvas{z-index:2}

/* ===== Welcome - Portal Style ===== */
#welcomeOverlay{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%,#2e2018 0%,#1e1610 55%,#100c08 100%);
  transition:opacity .8s ease,visibility .8s ease;padding:20px;overflow:hidden}
#welcomeOverlay.hidden{opacity:0;visibility:hidden;pointer-events:none}

/* Portal ring */
.portal{position:relative;width:180px;height:180px;margin-bottom:36px}
.portal-ring{position:absolute;inset:0;border-radius:50%;
  border:2px solid transparent;
  border-top-color:#e8b888;border-right-color:#d89058;
  animation:ringSpin 3s linear infinite}
.portal-ring.r2{inset:-12px;border-top-color:transparent;border-right-color:transparent;
  border-bottom-color:rgba(232,184,136,.5);border-left-color:rgba(216,144,88,.4);
  animation:ringSpin 5s linear infinite reverse}
.portal-ring.r3{inset:-24px;border:1px solid rgba(220,175,130,.15);animation:ringSpin 8s linear infinite}
.portal::after{content:'';position:absolute;inset:-30px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,168,104,.12) 0%,transparent 70%);
  animation:portalPulse 3s ease-in-out infinite}
@keyframes ringSpin{to{transform:rotate(360deg)}}
@keyframes portalPulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.portal img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;
  border:3px solid rgba(232,184,136,.4);box-shadow:0 0 40px rgba(216,144,88,.25)}

/* Typewriter title */
.hero-name{font-family:'Noto Serif SC',serif;font-size:26px;font-weight:900;letter-spacing:3px;
  color:#f0e4d4;margin-bottom:10px;min-height:40px;text-align:center;white-space:nowrap;
  text-shadow:0 0 30px rgba(232,168,104,.2)}
.hero-name .cursor{display:inline-block;width:3px;height:24px;background:#e8a868;
  vertical-align:middle;margin-left:4px;animation:blink .8s step-end infinite}
@keyframes blink{50%{opacity:0}}
.hero-tagline{font-size:14px;color:#c8a078;letter-spacing:3px;margin-bottom:28px;text-align:center}

/* Floating tags around portal */
.float-tags{position:absolute;inset:0;pointer-events:none}
.float-tag{position:absolute;padding:6px 14px;border-radius:16px;font-size:12px;color:#e0c0a0;
  background:rgba(220,175,130,.08);border:1px solid rgba(220,175,130,.2);
  backdrop-filter:blur(6px);animation:floatY 4s ease-in-out infinite}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* Enter button - ghost style */
.enter-btn{margin-top:12px;padding:14px 48px;border-radius:40px;font-size:16px;font-weight:600;
  letter-spacing:6px;color:#e8b888;background:transparent;
  border:1.5px solid rgba(232,184,136,.4);
  transition:all .3s;position:relative;overflow:hidden}
.enter-btn::before{content:'';position:absolute;inset:0;border-radius:40px;
  background:linear-gradient(135deg,rgba(232,184,136,.15),rgba(216,144,88,.15));
  opacity:0;transition:opacity .3s}
.enter-btn:hover{border-color:#e8b888;box-shadow:0 0 24px rgba(216,144,88,.25);transform:translateY(-2px)}
.enter-btn:hover::before{opacity:1}
.enter-btn:active{transform:scale(.97)}

.welcome-note{font-size:11px;color:#8a7a60;margin-top:18px;letter-spacing:1px}

/* Decorative particles in welcome */
.w-particle{position:absolute;width:3px;height:3px;border-radius:50%;
  background:rgba(232,184,136,.4);animation:wFloat linear infinite}
@keyframes wFloat{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-100vh);opacity:0}}

/* ===== Main ===== */
#mainSite{opacity:0;transition:opacity 1s ease;position:relative;z-index:5;min-height:100vh}
#mainSite.visible{opacity:1}

.nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:center;align-items:center;
  padding:16px 20px;background:rgba(30,22,16,.75);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(220,175,130,.1)}
.nav-inner{display:flex;gap:28px;align-items:center}
.nav-brand{font-size:16px;font-weight:700;color:#e8a868}
.nav-item{font-size:14px;color:#a08868;cursor:pointer;padding:4px 0;position:relative;transition:color .2s}
.nav-item:hover,.nav-item.active{color:#f0e4d4}
.nav-item.active::after{content:'';position:absolute;bottom:-4px;left:0;right:0;height:2px;
  background:linear-gradient(90deg,#e8b888,#d89058);border-radius:2px}

.music-btn{position:fixed;top:16px;right:20px;z-index:60;width:36px;height:36px;border-radius:50%;
  background:rgba(220,175,130,.1);border:1px solid rgba(220,175,130,.25);color:#e0c0a0;
  display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s}
.music-btn:hover{background:rgba(220,175,130,.22)}

.section{display:none;padding:100px 20px 60px;max-width:900px;margin:0 auto}
.section.active{display:block}
.section-title{font-size:28px;font-weight:700;margin-bottom:8px;color:#f0e4d4}
.section-title .accent{color:#e8a868}
.section-desc{font-size:14px;color:#a08868;margin-bottom:32px}

.skill-grid{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:640px){.skill-grid{grid-template-columns:repeat(3,1fr)}}
.skill-card{padding:28px 20px;border-radius:16px;background:rgba(48,34,24,.5);
  border:1px solid rgba(220,175,130,.15);backdrop-filter:blur(10px);text-align:center;transition:transform .2s,border-color .2s}
.skill-card:hover{transform:translateY(-4px);border-color:rgba(220,175,130,.35)}
.skill-icon{width:56px;height:56px;margin:0 auto 14px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:24px;background:rgba(220,175,130,.12);color:#e8a868;font-weight:700}
.skill-name{font-size:17px;font-weight:600;margin-bottom:6px;color:#f0e4d4}
.skill-level{font-size:12px;color:#b88858;margin-bottom:10px}
.skill-desc{font-size:12px;color:#a08868;line-height:1.6}

/* Game */
.game-box{padding:30px;border-radius:20px;background:rgba(48,34,24,.5);
  border:1px solid rgba(220,175,130,.15);backdrop-filter:blur(10px);text-align:center;max-width:420px;margin:0 auto}
.game-title{font-size:20px;font-weight:700;margin-bottom:8px;color:#e8a868}
.game-hint{font-size:13px;color:#a08868;margin-bottom:20px}
.game-input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid rgba(220,175,130,.22);
  background:rgba(30,22,16,.6);color:#f0e4d4;font-size:16px;text-align:center;outline:none;margin-bottom:12px}
.game-input:focus{border-color:#e8a868}
.game-btn{padding:12px 32px;border-radius:12px;font-size:15px;font-weight:600;color:#2e1e10;
  background:linear-gradient(135deg,#e8b888,#d89058);transition:transform .2s}
.game-btn:hover{transform:scale(1.03)}
.game-result{margin-top:16px;font-size:16px;min-height:24px;font-weight:600}
.game-result.win{color:#98c888}
.game-result.lose{color:#e89888}
.game-result.hint{color:#e8c078}
.game-count{margin-top:8px;font-size:12px;color:#7e6a50}

/* Contact */
.contact-list{display:flex;flex-direction:column;gap:16px;max-width:420px;margin:0 auto}
.contact-item{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:14px;
  background:rgba(48,34,24,.5);border:1px solid rgba(220,175,130,.15);transition:border-color .2s}
.contact-item:hover{border-color:rgba(220,175,130,.35)}
.contact-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;background:rgba(220,175,130,.12);color:#e8a868}
.contact-label{font-size:13px;color:#a08868}
.contact-value{font-size:15px;color:#f0e4d4;font-weight:500}

.footer{text-align:center;padding:30px 20px;font-size:12px;color:#5e4e3a}
</style>
</head>
<body>
<audio id="bgmAudio" loop>
  <source src="bgm.mp3" type="audio/mpeg">

<button onclick="const audio=document.getElementById('bgmAudio');audio.paused?audio.play():audio.pause()">♪ 背景音乐开关</button>
<canvas id="particleCanvas"></canvas>
<canvas id="petalCanvas"></canvas>

<!-- 背景音乐：把你的mp3命名为 bgm.mp3 放在同目录即可 -->
<audio id="bgMusic" loop preload="auto" volume="0.3"></audio>

<!-- Welcome - Portal -->
<div id="welcomeOverlay">
  <div class="float-tags" id="floatTags"></div>
  <div id="wParticles"></div>
  <div class="portal">
    <div class="portal-ring"></div>
    <div class="portal-ring r2"></div>
    <div class="portal-ring r3"></div>
    <img src="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/Nqm8bjIWQofAQqxCCq1cG1Csnid" alt="avatar">
  </div>
  <h1 class="hero-name"><span id="typewriter"></span><span class="cursor"></span></h1>
  <p class="hero-tagline">虚拟现实技术 · 正在探索无限可能</p>
  <button class="enter-btn" id="enterBtn">进 入</button>
  <p class="welcome-note">进入后自动播放背景音乐 · 右上角可关闭</p>
</div>

<!-- Main -->
<div id="mainSite">
  <nav class="nav">
    <div class="nav-inner">
      <span class="nav-brand">王镱潼</span>
      <span class="nav-item active" data-section="skills">学习中</span>
      <span class="nav-item" data-section="game">小游戏</span>
      <span class="nav-item" data-section="contact">联系我</span>
    </div>
  </nav>
  <button class="music-btn" id="musicBtn" title="背景音乐">♪</button>

  <!-- Skills -->
  <div class="section active" id="section-skills">
    <h2 class="section-title">正在学习 <span class="accent">这些</span></h2>
    <p class="section-desc">虚拟现实技术方向，目前在啃这些工具和语言</p>
    <div class="skill-grid">
      <div class="skill-card">
        <div class="skill-icon">C+</div>
        <h3 class="skill-name">C / C++</h3>
        <p class="skill-level">入门阶段</p>
        <p class="skill-desc">正在学习基础语法、指针、内存管理，为后续图形学打基础</p>
      </div>
      <div class="skill-card">
        <div class="skill-icon">U</div>
        <h3 class="skill-name">Unity</h3>
        <p class="skill-level">入门阶段</p>
        <p class="skill-desc">学习引擎操作、场景搭建、C# 脚本，做 VR 交互原型</p>
      </div>
      <div class="skill-card">
        <div class="skill-icon">M</div>
        <h3 class="skill-name">Maya</h3>
        <p class="skill-level">入门阶段</p>
        <p class="skill-desc">学习三维建模、UV 展开、材质贴图，做游戏资产</p>
      </div>
    </div>
  </div>

  <!-- Game -->
  <div class="section" id="section-game">
    <h2 class="section-title">猜数字 <span class="accent">小游戏</span></h2>
    <p class="section-desc">我心里想了一个 1~100 的数字，来猜猜看</p>
    <div class="game-box">
      <h3 class="game-title">猜数字</h3>
      <p class="game-hint">输入一个 1 到 100 之间的整数</p>
      <input type="number" class="game-input" id="gameInput" min="1" max="100" placeholder="输入你的猜测">
      <br>
      <button class="game-btn" id="gameBtn">猜！</button>
      <div class="game-result" id="gameResult"></div>
      <div class="game-count" id="gameCount">已猜 0 次</div>
    </div>
  </div>

  <!-- Contact -->
  <div class="section" id="section-contact">
    <h2 class="section-title">联系 <span class="accent">我</span></h2>
    <p class="section-desc">随时欢迎交流技术、VR、游戏或者任何有趣的事情</p>
    <div class="contact-list">
      <div class="contact-item">
        <div class="contact-icon">@</div>
        <div>
          <div class="contact-label">邮箱</div>
          <div class="contact-value">1579165491@qq.com</div>
        </div>
      </div>
      <div class="contact-item">
        <div class="contact-icon">G</div>
        <div>
          <div class="contact-label">GitHub</div>
          <div class="contact-value">github.com/19ong</div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">© 2026 王镱潼 · 虚拟现实技术</div>
</div>

<script>
/* ===== Welcome Animations ===== */
(function(){
  // Typewriter - name part gets gradient
  const tw=document.getElementById('typewriter');
  const text='你好，我是王镱潼';
  const nameStart=5; // index where 王镱潼 starts
  let i=0;
  function type(){
    if(i<text.length){
      const ch=text[i];
      if(i===nameStart){
        const span=document.createElement('span');
        span.style.background='linear-gradient(135deg,#e8b888,#d89058)';
        span.style.webkitBackgroundClip='text';
        span.style.webkitTextFillColor='transparent';
        span.textContent=ch;
        tw.appendChild(span);
        tw._nameSpan=span;
      }else if(i>nameStart&&i<nameStart+3){
        tw._nameSpan.textContent+=ch;
      }else{
        tw.appendChild(document.createTextNode(ch));
      }
      i++;setTimeout(type,140);
    }
  }
  type();

  // Floating tags around portal
  const tags=['C / C++','Unity','Maya','VR','3D建模'];
  const positions=[
    {top:'18%',left:'8%'},{top:'25%',right:'10%'},
    {top:'55%',left:'5%'},{top:'60%',right:'8%'},
    {top:'78%',left:'15%'}
  ];
  const container=document.getElementById('floatTags');
  tags.forEach((t,i)=>{
    const el=document.createElement('span');
    el.className='float-tag';el.textContent=t;
    Object.assign(el.style,positions[i]);
    el.style.animationDelay=(i*.5)+'s';
    container.appendChild(el);
  });

  // Rising particles
  const pc=document.getElementById('wParticles');
  for(let i=0;i<20;i++){
    const p=document.createElement('span');
    p.className='w-particle';
    p.style.left=Math.random()*100+'%';
    p.style.bottom='-10px';
    p.style.animationDuration=(4+Math.random()*6)+'s';
    p.style.animationDelay=Math.random()*5+'s';
    p.style.opacity=.2+Math.random()*.4;
    pc.appendChild(p);
  }
})();

/* ===== Petal (small, warm orange) ===== */
(function(){
  const canvas=document.getElementById('petalCanvas');
  const ctx=canvas.getContext('2d');
  let W,H,petals=[];
  const COLORS=[
    'rgba(232,184,136,0.4)','rgba(216,144,88,0.35)',
    'rgba(240,200,160,0.35)','rgba(200,130,70,0.3)',
    'rgba(250,220,190,0.3)','rgba(228,168,110,0.35)'
  ];
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
  resize();window.addEventListener('resize',resize);
  function make(){return{
    x:Math.random()*W,y:Math.random()*H,
    size:3+Math.random()*6,
    vx:(Math.random()-.5)*1.8,vy:(Math.random()-.5)*1+.5,
    rot:Math.random()*Math.PI*2,rs:(Math.random()-.5)*.03,
    color:COLORS[Math.floor(Math.random()*COLORS.length)],
    sway:Math.random()*Math.PI*2
  }}
  for(let i=0;i<70;i++)petals.push(make());
  function loop(){
    ctx.clearRect(0,0,W,H);
    petals.forEach((p,i)=>{
      p.sway+=.02;p.x+=p.vx+Math.sin(p.sway)*.5;p.y+=p.vy;p.rot+=p.rs;
      if(p.y>H+20||p.x<-30||p.x>W+30){petals[i]=make();petals[i].y=-20;petals[i].x=Math.random()*W}
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.color;ctx.beginPath();
      ctx.ellipse(0,0,p.size,p.size*.6,0,0,Math.PI*2);ctx.fill();ctx.restore();
    });
    requestAnimationFrame(loop);
  }
  loop();
})();

/* ===== Stars ===== */
(function(){
  const canvas=document.getElementById('particleCanvas');
  const ctx=canvas.getContext('2d');
  let W,H,stars=[];
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
  resize();window.addEventListener('resize',resize);
  for(let i=0;i<50;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.3,a:Math.random(),s:.005+Math.random()*.02});
  function loop(){
    ctx.clearRect(0,0,W,H);
    stars.forEach(s=>{s.a+=s.s;if(s.a>1||s.a<0)s.s*=-1;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle='rgba(220,175,130,'+Math.abs(s.a)*.5+')';ctx.fill();});
    requestAnimationFrame(loop);
  }
  loop();
})();

/* ===== Nav ===== */
document.querySelectorAll('.nav-item').forEach(item=>{
  item.addEventListener('click',()=>{
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    item.classList.add('active');
    document.getElementById('section-'+item.dataset.section).classList.add('active');
    window.scrollTo({top:0,behavior:'smooth'});
  });
});

/* ===== Game ===== */
(function(){
  let target=Math.floor(Math.random()*100)+1,count=0;
  const input=document.getElementById('gameInput'),btn=document.getElementById('gameBtn');
  const result=document.getElementById('gameResult'),countEl=document.getElementById('gameCount');
  function guess(){
    const val=parseInt(input.value);
    if(isNaN(val)||val<1||val>100){result.className='game-result lose';result.textContent='请输入 1~100 的数字';return}
    count++;countEl.textContent='已猜 '+count+' 次';
    if(val===target){result.className='game-result win';result.textContent='猜对了！就是 '+target+'，用了 '+count+' 次';target=Math.floor(Math.random()*100)+1;count=0;}
    else if(val<target){result.className='game-result hint';result.textContent='太小了，往大猜';}
    else{result.className='game-result hint';result.textContent='太大了，往小猜';}
    input.value='';input.focus();
  }
  btn.addEventListener('click',guess);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')guess()});
})();

/* ===== Music ===== */
const bgMusic=document.getElementById('bgMusic');
const musicBtn=document.getElementById('musicBtn');
let musicOn=false;
function startMusic(){
  bgMusic.volume=0.3;
  bgMusic.play().catch(()=>{});
  musicOn=true;
  musicBtn.style.background='rgba(220,175,130,.25)';
}
function stopMusic(){
  bgMusic.pause();
  musicOn=false;
  musicBtn.style.background='rgba(220,175,130,.1)';
}
musicBtn.addEventListener('click',()=>{musicOn?stopMusic():startMusic()});

/* ===== Enter ===== */
document.getElementById('enterBtn').addEventListener('click',()=>{
  document.getElementById('welcomeOverlay').classList.add('hidden');
  document.getElementById('mainSite').classList.add('visible');
  startMusic();
});
</script>
</body>
</html>
